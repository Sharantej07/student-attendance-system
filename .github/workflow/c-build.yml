name: C Build and Run

on:
  push:
    branches:
      - main
      - F3-3-feature-branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compile C Program
        run: gcc main.c -o main

      - name: Run Program
        run: ./main